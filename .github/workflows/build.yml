name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Linux
        run: GOOS=linux GOARCH=amd64 go build -o bin/dashboard-linux-amd64 ./cmd/dashboard
      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -o bin/dashboard-windows-amd64.exe ./cmd/dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
